name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:data
      - name: check generated data is in sync with its sources
        run: git diff --exit-code -- src/data
      # runs tsc --noEmit before vite build
      - run: npm run build
